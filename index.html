<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIP39 &harr; Shamir Secret Sharing</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #222;
            --text: #ddd;
            --card-bg: #333;
            --border: #555;
            --accent: #4a90e2;
            --error: #e74c3c;
        }
        [data-theme="light"] {
            color-scheme: light;
            --bg: #f4f4f4;
            --text: #222;
            --card-bg: #fff;
            --border: #ccc;
        }
        body { font-family: sans-serif; line-height: 1.6; max-width: 1100px; margin: auto; padding: 20px; background: var(--bg); color: var(--text); }
        .header { display: flex; justify-content: space-between; align-items: center; }
        #themeToggle { width: 120px; margin: 0; padding: 6px; }
        .card { background: var(--card-bg); padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input, textarea, button { width: 100%; padding: 10px; margin-bottom: 16px; border: 1px solid var(--border); background: var(--bg); color: var(--text); box-sizing: border-box; }
        textarea { height: 80px; resize: vertical; }
        button { background: var(--accent); color: #fff; cursor: pointer; border: none; font-weight: bold; }
        input[readonly], textarea[readonly] { border-left: 4px solid var(--accent); }
        .mono { font-family: monospace; }
        input[type="number"] { width: 70px; display: inline-block; margin: 0 5px; }
        .output { padding: 16px; border-left: 4px solid var(--accent); background: var(--bg); white-space: pre-wrap; word-break: break-all; }
        .output.hidden { display: none; }
        .output.error { border-color: var(--error); color: var(--error); margin-bottom: 16px; }
        .layout-row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
        .layout-col { flex: 1 1 400px; min-width: 0; }
        .parts { padding-left: 20px; overflow-wrap: break-word; }
        .parts li { margin-bottom: 10px; }
        .parts button { margin-bottom: 6px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>BIP39 &harr; Shamir</h1>
        <button type="button" id="themeToggle"></button>
    </div>
    <p>Split a BIP39 mnemonic into Shamir secret sharing parts, and combine parts back into the mnemonic. Fully offline &mdash; save this page as a file and open it on an air-gapped computer.</p>

    <div class="layout-row">
        <div class="layout-col card">
            <h2>BIP39 &rarr; Shamir</h2>
            <label for="mnemonicInput">BIP39 Mnemonic (12, 15, 18, 21, or 24 words)</label>
            <textarea id="mnemonicInput" placeholder="e.g. zoo zoo zoo zoo zoo zoo zoo zoo zoo zoo zoo wrong" autocomplete="off" spellcheck="false"></textarea>
            <label for="entropyOutput">Entropy</label>
            <input type="text" id="entropyOutput" class="mono" readonly placeholder="hex entropy of the mnemonic">
            <p>
                Require
                <input id="required" type="number" value="2" min="2" max="255">
                of
                <input id="total" type="number" value="3" min="2" max="255">
                parts to reconstruct
            </p>
            <div id="splitError" class="output error hidden"></div>
            <h2>Parts</h2>
            <ol id="partsList" class="parts">
                <li>Enter your mnemonic above.</li>
            </ol>
        </div>

        <div class="layout-col card">
            <h2>Combine</h2>
            <label for="partsInput">Enter the parts, one per line</label>
            <textarea id="partsInput" autocomplete="off" spellcheck="false"></textarea>
            <label for="combinedHex">Hex Data</label>
            <input type="text" id="combinedHex" class="mono" readonly placeholder="hex data recovered from the parts">
            <label for="combinedMnemonic">BIP39</label>
            <textarea id="combinedMnemonic" readonly placeholder="mnemonic recovered from the parts"></textarea>
            <div id="combineError" class="output error hidden"></div>
        </div>
    </div>

    <!-- secrets.js -->
    <script>

/*jslint passfail: false, bitwise: true, nomen: true, plusplus: true, todo: false, maxerr: 1000 */
/*global define, require, module, exports, window, Uint32Array, sjcl */

(function (root, factory) {
    "use strict";

            return (root.secrets = factory());

        runCSPRNGTest,
        sjclParanoia,
        CSPRNGTypes;

    function reset() {
        defaults = {
            bits: 8,
            radix: 16,
            minBits: 3,
            maxBits: 20,
            bytesPerChar: 2,
            maxBytesPerChar: 6,
            primitivePolynomials: [null, null, 1, 3, 3, 5, 3, 3, 29, 17, 9, 5, 83, 27, 43, 3, 45, 9, 39, 39, 9, 5, 3, 33, 27, 9, 71, 39, 9, 5, 83]

        } else if (type && type === "nodeCryptoRandomBytes") {
            config.typeCSPRNG = type;

        } else if (type && type === "browserCryptoGetRandomValues") {
            config.typeCSPRNG = type;

        } else if (type && type === "browserSJCLRandom") {

        random: function (bits) {

            }

                    x[j] = x[j] || subShares[j].x.toString(config.radix);
                    y[j] = padLeft(subShares[j].y.toString(2)) + (y[j] || "");
                }
            }
            for (i = 0; i < numShares; i++) {

            const VALID_HEX_LENGTHS = [32, 40, 48, 56, 64];
            const VALID_WORD_COUNTS = [12, 15, 18, 21, 24];

            async function sha256(bytes) {
                return new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
            }

            function bytesToBits(bytes) {
                let bits = "";
                for (let i = 0; i < bytes.length; i++) {
                    bits += bytes[i].toString(2).padStart(8, "0");
                }
                return bits;
            }

            async function entropyToMnemonic(hex) {
                hex = hex.trim().toLowerCase();
                if (!/^[0-9a-f]+$/.test(hex) || !VALID_HEX_LENGTHS.includes(hex.length)) {
                    throw new Error("Entropy must be 32, 40, 48, 56, or 64 hex characters.");
                }
                const bytes = new Uint8Array(hex.length / 2);
                for (let i = 0; i < bytes.length; i++) {
                    bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
                }
                let bits = bytesToBits(bytes);
                const hash = await sha256(bytes);
                bits += bytesToBits(hash).slice(0, bits.length / 32);
                const words = [];
                for (let i = 0; i < bits.length; i += 11) {
                    words.push(wordlist[parseInt(bits.slice(i, i + 11), 2)]);
                }
                return words.join(" ");
            }

            async function mnemonicToEntropy(mnemonic) {
                const words = mnemonic.trim().toLowerCase().split(/\s+/);
                if (!VALID_WORD_COUNTS.includes(words.length)) {
                    throw new Error("Word count must be 12, 15, 18, 21, or 24.");
                }
                let bits = "";
                for (const word of words) {
                    const idx = wordlist.indexOf(word);
                    if (idx === -1) {
                        throw new Error(`Invalid word "${word}".`);
                    }
                    bits += idx.toString(2).padStart(11, "0");
                }
                const chkLen = words.length / 3;
                const entBits = bits.slice(0, bits.length - chkLen);
                const bytes = new Uint8Array(entBits.length / 8);
                let hex = "";
                for (let i = 0; i < bytes.length; i++) {
                    bytes[i] = parseInt(entBits.slice(i * 8, i * 8 + 8), 2);
                    hex += bytes[i].toString(16).padStart(2, "0");
                }
                const hash = await sha256(bytes);
                const valid = bits.slice(entBits.length) === bytesToBits(hash).slice(0, chkLen);
                return { hex, valid };
            }

                dom.themeToggle.innerText = isDark ? "to light mode" : "to dark mode";
            }

            applyTheme();

            dom.themeToggle.addEventListener("click", () => {
                isDark = !isDark;
                applyTheme();
            });

            async function copyToClipboard(text) {
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(text);
                    } else {
                        const ta = document.createElement("textarea");
                        ta.value = text;
                        ta.style.position = "fixed";
                        ta.style.opacity = "0";
                        document.body.appendChild(ta);
                        ta.focus();
                        ta.select();
                        document.execCommand("copy");
                        document.body.removeChild(ta);
                    }
                } catch {
                    console.warn("Clipboard write failed");
                }
            }

            function showError(el, msg) {
                el.textContent = msg;
                el.classList.remove("hidden");
            }

            function clearError(el) {
                el.textContent = "";
                el.classList.add("hidden");
            }

            function setPartsPlaceholder(text) {
                dom.partsList.innerHTML = "";
                const li = document.createElement("li");
                li.textContent = text;
                dom.partsList.appendChild(li);
            }

            let splitSeq = 0;

            async function updateSplit() {
                const seq = ++splitSeq;
                const mnemonic = dom.mnemonicInput.value.trim();

                dom.entropyOutput.value = "";
                clearError(dom.splitError);

                if (!mnemonic) {
                    return setPartsPlaceholder("Enter your mnemonic above.");
                }

                let entropy;
                try {
                    entropy = await bip39.mnemonicToEntropy(mnemonic);
                } catch (e) {
                    if (seq !== splitSeq) return;
                    setPartsPlaceholder("Enter a valid mnemonic above.");
                    return showError(dom.splitError, e.message);
                }
                if (seq !== splitSeq) return;

                dom.entropyOutput.value = entropy.hex;

                if (!entropy.valid) {
                    setPartsPlaceholder("Enter a valid mnemonic above.");
                    return showError(dom.splitError, "Checksum failed: this is not a valid BIP39 mnemonic.");
                }

                const required = parseFloat(dom.required.value);
                const total = parseFloat(dom.total.value);
                if (isNaN(required) || required % 1 !== 0) return showError(dom.splitError, "Invalid value for required parts.");
                if (isNaN(total) || total % 1 !== 0) return showError(dom.splitError, "Invalid value for total parts.");
                if (required < 2) return showError(dom.splitError, "Required parts must be at least 2.");
                if (total < 2) return showError(dom.splitError, "Total parts must be at least 2.");
                if (required > 255 || total > 255) return showError(dom.splitError, "Parts must be at most 255.");
                if (required > total) return showError(dom.splitError, "Required parts must be less than or equal to total parts.");

                const shares = secrets.share(entropy.hex, total, required);

                dom.partsList.innerHTML = "";
                shares.forEach((share, index) => {
                    const li = document.createElement("li");

                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.textContent = `Copy part ${index + 1} to clipboard`;
                    btn.onclick = () => copyToClipboard(share);

                    const box = document.createElement("input");
                    box.type = "text";
                    box.value = share;
                    box.readOnly = true;
                    box.className = "mono";
                    box.onfocus = () => box.select();

                    li.appendChild(btn);
                    li.appendChild(box);
                    dom.partsList.appendChild(li);
                });
            }

            let combineSeq = 0;

            async function updateCombine() {
                const seq = ++combineSeq;
                const parts = dom.partsInput.value.trim().split(/\s+/).filter(Boolean);

                dom.combinedHex.value = "";
                dom.combinedMnemonic.value = "";
                clearError(dom.combineError);

                if (parts.length === 0) return;

                let hex;
                try {
                    hex = secrets.combine(parts);
                } catch (e) {
                    return showError(dom.combineError, e.message);
                }

                dom.combinedHex.value = hex;

                try {
                    const mnemonic = await bip39.entropyToMnemonic(hex);
                    if (seq !== combineSeq) return;
                    dom.combinedMnemonic.value = mnemonic;
                } catch {
                    if (seq !== combineSeq) return;
                    showError(dom.combineError, "Recovered hex is not valid BIP39 entropy (needs 32, 40, 48, 56, or 64 hex characters). Check that you entered enough distinct parts.");
                }
            }

            dom.mnemonicInput.addEventListener("input", updateSplit);
            dom.required.addEventListener("input", updateSplit);
            dom.total.addEventListener("input", updateSplit);
            dom.partsInput.addEventListener("input", updateCombine);
        }
